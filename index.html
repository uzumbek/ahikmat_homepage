<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7; --bg-2:#efe7d8; --surface:#fffdf8;
    --ink:#211a12; --ink-soft:#4a4034; --muted:#8a7d6a;
    --line:#ddd0ba; --accent:#c1440e; --accent-soft:#e8a877;
    --display:"Fraunces",Georgia,serif;
    --sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent);color:#fff}

  /* scroll progress */
  .progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:100;transition:width .1s linear}

  .wrap{max-width:1000px;margin:0 auto;padding:0 24px}

  /* nav */
  header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;height:62px;gap:16px}
  .logo{font-family:var(--display);font-weight:600;font-size:19px}
  .logo i{color:var(--accent);font-style:normal}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .gh{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--surface);transition:.2s}
  .gh:hover{color:var(--ink);border-color:var(--ink)}
  .gh svg{width:15px;height:15px;fill:currentColor}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .lang button{font-family:var(--sans);font-size:12.5px;font-weight:600;background:transparent;color:var(--muted);border:0;padding:7px 13px;cursor:pointer;transition:.2s}
  .lang button:hover{color:var(--ink)}
  .lang button.active{background:var(--ink);color:var(--bg)}
  .mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .mode button{font-family:var(--sans);font-size:12.5px;font-weight:600;background:transparent;color:var(--muted);border:0;padding:7px 13px;cursor:pointer;transition:.2s}
  .mode button:hover{color:var(--ink)}
  .mode button.active{background:var(--accent);color:#fff}
  body.mode-simple .stop ul,
  body.mode-simple .stop .chips{display:none}
  body.mode-simple .stop--edu ul,
  body.mode-simple .stop--edu .chips{display:block}

  /* hero */
  .hero{padding:90px 0 70px;text-align:left}
  .hero .kicker{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:24px}
  .hero h1{font-family:var(--display);font-weight:500;font-size:clamp(48px,9vw,104px);line-height:.98;letter-spacing:-2px;margin:0 0 28px}
  .hero h1 em{font-style:italic;color:var(--accent)}
  .hero .lede{font-size:20px;color:var(--ink-soft);max-width:38em;margin:0 0 30px}
  /* journey route: a slim sticky bar with a horizontal track of 3 stops */
  .routebar{position:sticky;top:62px;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:12px 0 26px;transition:box-shadow .4s ease}
  .routebar.stuck{box-shadow:0 14px 30px -22px rgba(0,0,0,.6)}
  .track{position:relative;height:2px;background:var(--line);border-radius:2px}
  .fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--accent);border-radius:2px}
  .node{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--line);transform:translate(-50%,-50%);z-index:2;transition:background .35s,border-color .35s,box-shadow .35s}
  .node.passed{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
  .dot{position:absolute;top:50%;left:0%;width:15px;height:15px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);z-index:3;pointer-events:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent),0 2px 6px rgba(0,0,0,.2)}
  .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ping 2.4s ease-out infinite}
  @keyframes ping{0%{transform:scale(.55);opacity:.5}70%{transform:scale(1.5);opacity:0}100%{transform:scale(1.5);opacity:0}}
  .labels{position:relative;height:22px;margin-top:12px;font-family:var(--display);font-size:15px;color:var(--muted)}
  .lbl{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:color .4s ease}
  .lbl .flag{width:16px;height:11px}
  .lbl.passed{color:var(--ink)}
  .hero .cta{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
  .btn{font-family:var(--sans);font-weight:600;font-size:15px;padding:13px 24px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:9px}
  .btn svg{width:17px;height:17px;fill:currentColor}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px var(--accent)}
  .btn.ghost:hover{background:var(--ink);color:var(--bg)}

  /* flags */
  .flag{width:22px;height:15px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.12);display:inline-block;flex:none}

  /* chapter */
  .chapter{padding:60px 0;border-top:1px solid var(--line)}
  .ch-grid{display:grid;grid-template-columns:200px 1fr;gap:40px;align-items:start}
  .ch-side{position:sticky;top:90px}
  .ch-side .no{font-family:var(--display);font-size:15px;color:var(--accent);font-weight:600}
  .ch-side .era{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.5px;line-height:1.1;margin-top:6px}
  .ch-side .place{font-size:14px;color:var(--muted);margin-top:10px}
  .ch-side .marker{width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:18px;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 20%,transparent)}
  .ch-body h2{font-family:var(--display);font-weight:500;font-size:clamp(30px,4.5vw,46px);letter-spacing:-1px;margin:0 0 18px;line-height:1.05}
  .ch-body .intro{font-size:18px;color:var(--ink-soft);max-width:40em;margin:0 0 30px}

  /* stop (a job) */
  .stop{position:relative;padding:0 0 34px 34px}
  .stop::before{content:"";position:absolute;left:5px;top:6px;bottom:-6px;width:2px;background:var(--line)}
  .stop:last-child{padding-bottom:0}
  .stop:last-child::before{bottom:6px}
  .stop::after{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
  .stop .co{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.3px}
  .stop .rl{color:var(--accent);font-weight:600;font-size:15px;margin-top:2px}
  .stop .when{font-size:13.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stop .team{font-size:13px;color:var(--muted);margin-top:2px}
  .stop ul{margin:14px 0 0;padding:0;list-style:none}
  .stop li{position:relative;padding-left:20px;margin-bottom:8px;color:var(--ink-soft);font-size:15.5px}
  .stop li::before{content:"—";position:absolute;left:0;color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .chip{font-size:12.5px;font-weight:500;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}

  /* highlight callout */
  .callout{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:20px 22px;margin:8px 0 26px}
  .callout .big{font-family:var(--display);font-weight:600;font-size:30px;color:var(--accent);line-height:1}
  .callout .cap{font-size:14.5px;color:var(--ink-soft);margin-top:8px}

  /* about section */
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
  .panel h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 16px}
  .edu-item{padding:12px 0;border-top:1px solid var(--line)}
  .edu-item:first-child{border-top:0;padding-top:0}
  .edu-item .per{font-size:12.5px;color:var(--accent);font-weight:600}
  .edu-item h4{font-family:var(--display);font-weight:600;font-size:16px;margin:4px 0 2px}
  .edu-item .sch{color:var(--ink-soft);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .edu-item .maj{color:var(--muted);font-size:13px}
  .lang-row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
  .lang-row:first-child{border-top:0;padding-top:0}
  .lang-row .l{font-weight:600}
  .lang-row .r{color:var(--accent)}

  /* contact */
  .contact{padding:70px 0 80px;text-align:center}
  .contact .kicker{font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  .contact h2{font-family:var(--display);font-weight:500;font-size:clamp(38px,7vw,72px);letter-spacing:-1.5px;margin:0 0 18px;line-height:1}
  .contact h2 em{font-style:italic;color:var(--accent)}
  .contact p{font-size:18px;color:var(--ink-soft);max-width:34em;margin:0 auto 30px}
  .contact .rows{display:flex;justify-content:center;gap:14px 40px;flex-wrap:wrap;margin-bottom:30px}
  .contact .row .k{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .contact .row .v{font-size:16px;font-weight:600;margin-top:3px;display:inline-flex;align-items:center;gap:8px}
  .contact .row a.v:hover{color:var(--accent)}
  .contact .row .v svg{width:16px;height:16px;fill:currentColor}

  footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

  .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
  .reveal.in{opacity:1;transform:none}

  @media (max-width:760px){
    /* nav: wrap to two rows so logo + 5 langs + 2 mode fit without horizontal scroll */
    .nav{flex-wrap:wrap;height:auto;padding:12px 0;gap:10px}
    .nav-right{margin-left:0;width:100%;justify-content:space-between;gap:10px}
    .logo{font-size:18px}
    .lang button{padding:6px 10px;font-size:12px}
    .mode button{padding:6px 10px;font-size:12px}
    /* keep the rightmost route label inside the viewport */
    .routebar{padding-left:18px;padding-right:18px}
    .ch-grid{grid-template-columns:1fr;gap:18px}
    .ch-side{position:static;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
    .ch-side .marker{display:none}
    .about-grid{grid-template-columns:1fr}
    .gh{display:none}
    .labels{font-size:12px}
    .lbl .flag{width:13px;height:9px}
    .dot{width:12px;height:12px}
    .dot::after{inset:-5px}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .reveal{opacity:1;transform:none;transition:none}
    .dot::after{animation:none}
    *{transition-duration:.01ms!important}
  }
</style>
</head>

<script>
const C=window.CONTENT;
let lang=localStorage.getItem("ha_lang")||"uz";

// match on the CITY so it works in all five languages (EN/UZ Latin, RU Cyrillic, NL, KO)
function flagFor(place){
  if(/seoul|seul|seoel|сеул|서울/i.test(place)) return FLAGS.KR;
  if(/amsterdam|diemen|амстердам|дидем|암스테르담|디멘/i.test(place)) return FLAGS.NL;
  if(/tashkent|toshkent|tasjkent|ташкент|타슈켄트/i.test(place)) return FLAGS.UZ;
  return "";
}

function stopHtml(x){
  const team=x.team?`<div class="team">${esc(x.team)}</div>`:"";
  const flag=flagFor(x.loc);
  return `<div class="stop reveal">
    <div class="co">${esc(x.company)}</div>
    <div class="rl">${esc(x.role)}</div>
    <div class="when">${flag}<span>${esc(x.period)} · ${esc(x.loc)}</span></div>${team}
    <ul>${x.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>
    <div class="chips">${x.stack.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
  </div>`;
}

function render(){
  const c=C[lang], ch=CH[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  // detail-level toggle labels + active state
  $("modeSimple").textContent=ch.modeSimple;
  $("modeFull").textContent=ch.modeFull;
  document.querySelectorAll(".mode button").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  document.body.classList.toggle("mode-simple",mode==="simple");
  document.body.classList.toggle("mode-full",mode==="full");

  $("kicker").textContent=c.eyebrow;
  $("tagline").textContent=c.tagline;
  $("ctaCtTxt").textContent=c.ctaContact;
  $("ctaGhTxt").textContent="GitHub";
  const lblHtml=(name)=>`${flagFor(name)}<span>${esc(name)}</span>`;
  // Track order (left→right) matches chapter order (top→bottom): Amsterdam → Seoul → Tashkent
  $("r0").innerHTML=lblHtml(ch.r2); // Amsterdam
  $("r1").innerHTML=lblHtml(ch.r1); // Seoul
  $("r2").innerHTML=lblHtml(ch.r0); // Tashkent

  // Chapter 3: Tashkent (birth + bachelor's)
  $("era0").textContent=ch.era0; $("place0").textContent=ch.place0;
  $("ch0title").textContent=ch.ch0title; $("ch0intro").textContent=ch.ch0intro;
  const tashEdu=c.education.filter(e=>/tashkent|toshkent|tasjkent|ташкент|타슈켄트/i.test(e.school));
  $("tashkent").innerHTML=
    `<div class="stop stop--edu reveal"><div class="co">${flagFor(ch.r0)}<span>${esc(ch.r0)}</span></div>`+
    `<div class="rl">${esc(ch.tashNote)}</div>`+
    `<ul>${tashEdu.map(e=>`<li><strong>${esc(e.deg)}</strong> — ${esc(e.school)} (${esc(e.period)})</li>`).join("")}</ul></div>`;

  // split experience: Seoul (Korea) vs Amsterdam (Netherlands).
  // Match on the CITY so it works in all five languages (Seoul / Seul / Seoel / Сеул / 서울).
  const isSeoul=x=>/seoul|seul|seoel|сеул|서울/i.test(x.loc);
  const seoul=c.experience.filter(isSeoul);
  const amst=c.experience.filter(x=>!isSeoul(x));
  $("era1").textContent=ch.era1; $("place1").textContent=ch.place1;
  $("ch1title").textContent=ch.ch1title; $("ch1intro").textContent=ch.ch1intro;
  // Seoul master's degree as an education stop (matches on "Kookmin", stable across all 5 languages).
  // Appended LAST so the vertical timeline stays reverse-chronological: newest job on top,
  // the oldest item (the 2007–2009 master's) at the bottom.
  const seoulEdu=c.education.filter(e=>/kookmin/i.test(e.school));
  const seoulEduHtml=seoulEdu.map(e=>`
    <div class="stop stop--edu reveal">
      <div class="co">${flagFor(e.school)}<span>${esc(e.school)}</span></div>
      <div class="rl">${esc(e.deg)}</div>
      <div class="when"><span>${esc(e.period)}</span></div>
      <ul>${e.major?`<li>${esc(e.major)}</li>`:""}</ul>
    </div>`).join("");
  $("seoul").innerHTML=seoul.map(stopHtml).join("")+seoulEduHtml;

  $("era2").textContent=ch.era2; $("place2").textContent=ch.place2;
  $("ch2title").textContent=ch.ch2title; $("ch2intro").textContent=ch.ch2intro;
  $("amsterdam").innerHTML=amst.map(stopHtml).join("");

  $("era4").textContent=ch.era4;
  $("aboutTitle").textContent=ch.aboutTitle;
  $("eduTitle").textContent=c.eduTitle;
  $("edu").innerHTML=c.education.map(e=>
    `<div class="edu-item"><div class="per">${esc(e.period)}</div><h4>${esc(e.deg)}</h4><div class="sch">${flagFor(e.school)}<span>${esc(e.school)}</span></div><div class="maj">${esc(e.major)}</div></div>`).join("");
  $("langTitle").textContent=c.langTitle;
  $("langList").innerHTML=c.languages.map(l=>`<div class="lang-row"><span class="l">${esc(l)}</span><span class="r">${esc(c.langLevel)}</span></div>`).join("");

  $("contactKicker").textContent=ch.contactKicker;
  $("contactTitle").textContent=c.contactTitle;
  $("contactText").textContent=c.contactText;
  document.querySelectorAll(".contact .row .k").forEach(k=>{
    const key=k.dataset.k;
    k.textContent = key==="github" ? "GitHub" : c.contactKeys[key];
  });
  $("cLocation").innerHTML=flagFor(c.cLocation)+`<span>${esc(c.cLocation)}</span>`;
  $("footNote").textContent=c.footNote;

  observeReveals();
}

// scroll progress
function onScroll(){
  const h=document.documentElement;
  const p=h.scrollTop/(h.scrollHeight-h.clientHeight);
  $("progress").style.width=(p*100)+"%";
  // mark the route bar as stuck once it has locked under the header
  const bar=$("routebar");
  if(bar) bar.classList.toggle("stuck",bar.getBoundingClientRect().top<=(header?header.offsetHeight:63)+1);
  updateTraveler();
}
window.addEventListener("scroll",onScroll,{passive:true});

// journey dot: glides along the track as you scroll; the dot sits exactly on a node
// as you enter that city's chapter. Order is current→past (Amsterdam at the top/left,
// Tashkent at the bottom/right), so it starts at Amsterdam and reaches Tashkent at the end.
function updateTraveler(){
  const dot=$("dot");
  const fill=$("fill");
  if(!dot) return;
  // chs in DOM order (top→bottom): Amsterdam → Seoul → Tashkent.
  // The dot starts at the left node (Amsterdam) and reaches the right node (Tashkent) at the bottom.
  const chs=[document.getElementById("amsterdam").closest("section"),
             document.getElementById("seoul").closest("section"),
             document.getElementById("tashkent").closest("section")];
  const tops=chs.map(s=>s.getBoundingClientRect().top+window.scrollY);
  const st=window.scrollY;
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  let pct;
  if(st<=tops[0])           pct=0;
  else if(st<tops[1])       pct=50*clamp((st-tops[0])/(tops[1]-tops[0]),0,1);
  else if(st<tops[2])       pct=50+50*clamp((st-tops[1])/(tops[2]-tops[1]),0,1);
  else                       pct=100;
  dot.style.left=pct+"%";
  if(fill) fill.style.width=pct+"%";
  const nodes=[$("n0"),$("n1"),$("n2")];
  const lbls=[$("r0"),$("r1"),$("r2")];
  nodes.forEach((n,i)=>n.classList.toggle("passed",pct>=(i*50)-0.5));
  lbls.forEach((l,i)=>l.classList.toggle("passed",pct>=(i*50)-0.5));
}
window.addEventListener("resize",onScroll,{passive:true});

let io;
function observeReveals(){
  if(!("IntersectionObserver" in window)){document.querySelectorAll(".reveal").forEach(e=>e.classList.add("in"));return;}
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}})},{threshold:.12});
  document.querySelectorAll(".reveal:not(.in)").forEach(el=>io.observe(el));
}

$("year").textContent=new Date().getFullYear();
render();
onScroll();
window.addEventListener("load",onScroll);
</script>
